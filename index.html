<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Yablokostan Chronicle Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="quiz-container">
        
        <!-- START SCREEN -->
        <section id="start-screen" class="screen active">
            <h1>🍏 The Yablokostan Chronicle</h1>
            <p>Test your knowledge of the Great Pixel Wars (2024 - 2026).</p>
            <button id="start-btn" class="action-btn">Start Quiz</button>
        </section>

        <!-- QUIZ SCREEN -->
        <section id="quiz-screen" class="screen">
            <div class="header">
                <span id="question-counter">Question 1 / 8</span>
                <span id="score-display">Score: 0</span>
            </div>
            <h2 id="question-text">Question goes here</h2>
            <div id="options-container" class="options">
                <!-- Options will be generated by JS -->
            </div>
        </section>

        <!-- RESULT SCREEN -->
        <section id="result-screen" class="screen">
            <h1>War is Over!</h1>
            <p id="result-message">You scored X out of 8</p>
            <p id="rank-message" class="rank"></p>
            <button id="restart-btn" class="action-btn">Fight Again</button>
        </section>

    </main>
    <script src="program.js"></script>
</body>
</html>
